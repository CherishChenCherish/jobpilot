name: Daily Job Refresh

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6:00 AM UTC
  workflow_dispatch:       # Also allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily refresh
        run: |
          RESPONSE=$(curl -s --max-time 300 -X POST \
            https://jobpilot-v1.up.railway.app/api/admin/daily-refresh \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}")

          # Check if auth failed, retry with empty secret (Railway env var may not be set)
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "Auth with secret failed, retrying without..."
            RESPONSE=$(curl -s --max-time 300 -X POST \
              https://jobpilot-v1.up.railway.app/api/admin/daily-refresh \
              -H "X-Admin-Secret: ")
          fi

          if [ -z "$RESPONSE" ]; then
            echo "Warning: empty response (request may have timed out, but refresh runs in background)"
            exit 0
          fi

          echo "$RESPONSE" | python3 -c "
          import sys, json
          raw = sys.stdin.read().strip()
          if not raw:
            print('Empty response — refresh likely timed out but ran in background')
            sys.exit(0)
          try:
            d = json.loads(raw)
          except json.JSONDecodeError:
            print(f'Non-JSON response: {raw[:200]}')
            sys.exit(0)
          print(f'Cleaned: {d.get(\"cleaned\",0)}')
          print(f'Checked: {d.get(\"checked\",0)}')
          print(f'Closed: {d.get(\"closed\",0)}')
          print(f'New added: {d.get(\"new_added\",0)}')
          print(f'Active total: {d.get(\"active_total\",0)}')
          if d.get('error'): print(f'ERROR: {d[\"error\"]}')
          "
