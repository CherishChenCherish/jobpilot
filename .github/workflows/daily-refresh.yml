name: Daily Job Refresh

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6:00 AM UTC
  workflow_dispatch:       # Also allow manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily refresh
        run: |
          curl -s --max-time 300 -X POST \
            https://jobpilot-v1.up.railway.app/api/admin/daily-refresh \
            -H "X-Admin-Secret: ${{ secrets.ADMIN_SECRET }}" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f'Cleaned: {d.get(\"cleaned\",0)}')
          print(f'Checked: {d.get(\"checked\",0)}')
          print(f'Closed: {d.get(\"closed\",0)}')
          print(f'New added: {d.get(\"new_added\",0)}')
          print(f'Active total: {d.get(\"active_total\",0)}')
          "
