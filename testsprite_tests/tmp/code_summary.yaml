version: "2"
type: frontend
tech_stack:
  - TypeScript
  - Next.js 14 (App Router)
  - React 18
  - NextAuth (Google OAuth provider)
  - Tailwind CSS
  - Stripe.js (client-side checkout)
  - Vercel (hosting)
features:
  - name: Landing Page & Demo Verification
    description: Public landing page with hero, value proposition, and the demo "Verify Job URL" widget that calls the backend /api/demo-verify endpoint to show live job-status checking.
    files:
      - frontend/app/page.tsx
      - frontend/app/layout.tsx
    pages:
      - path: /
        description: Landing page with hero, features, CTA to sign in, and the demo-verify widget
        auth_required: false
    depends_on: []

  - name: Google OAuth Sign-In
    description: NextAuth-driven sign-in flow with the Google provider. Establishes a session cookie and calls the backend /api/sync-user endpoint after a successful sign-in to upsert the user record.
    files:
      - frontend/app/api/auth/[...nextauth]/route.ts
      - frontend/components/session-provider.tsx
      - frontend/components/navbar.tsx
    pages:
      - path: /api/auth/signin
        description: NextAuth sign-in page (Google OAuth)
        auth_required: false
      - path: /api/auth/callback/google
        description: NextAuth OAuth callback
        auth_required: false
    depends_on: []

  - name: Onboarding & Resume Upload
    description: First-time sign-in flow that collects the user's region, direction, degree, and visa needs, then uploads a resume PDF/DOCX to the backend /api/parse endpoint.
    files:
      - frontend/components/onboarding.tsx
      - frontend/app/dashboard/page.tsx
    pages:
      - path: /dashboard
        description: Dashboard entry point; runs onboarding for new users, then shows search results
        auth_required: true
    depends_on:
      - Google OAuth Sign-In

  - name: Dashboard — Job Search & Core Promise Results
    description: Authenticated dashboard. Calls backend /api/search with the user's direction/region/degree/visa and renders the promise-gated job list (open, location match, direction match, identity match). Includes region and degree filters.
    files:
      - frontend/app/dashboard/page.tsx
      - frontend/components/navbar.tsx
    pages:
      - path: /dashboard
        description: Job search results with region, direction, degree, and visa filters
        auth_required: true
    depends_on:
      - Google OAuth Sign-In
      - Onboarding & Resume Upload

  - name: Cover Letter Generation
    description: On a selected job card, triggers the backend /api/generate-cls/stream (SSE) endpoint and renders tokens as they stream. Also supports copying the final letter.
    files:
      - frontend/app/dashboard/page.tsx
    pages:
      - path: /dashboard
        description: Cover letter drawer/modal rendered in-place on the dashboard
        auth_required: true
    depends_on:
      - Dashboard — Job Search & Core Promise Results

  - name: Pricing & Stripe Checkout
    description: Pricing page showing the paid tier. "Upgrade" button calls backend /api/stripe/create-checkout to create a Stripe Checkout Session and redirects to Stripe.
    files:
      - frontend/app/pricing/page.tsx
    pages:
      - path: /pricing
        description: Pricing page with free vs paid comparison and upgrade CTA
        auth_required: false
    depends_on:
      - Google OAuth Sign-In

  - name: Navigation & Session UI
    description: Global navbar with sign-in/sign-out button, user avatar when authenticated, and links to /dashboard and /pricing.
    files:
      - frontend/components/navbar.tsx
      - frontend/components/session-provider.tsx
    pages:
      - path: "*"
        description: Persistent navbar across all routes
        auth_required: false
    depends_on:
      - Google OAuth Sign-In

known_limitations:
  - issue: Dev server (next dev) is single-threaded and may throttle under concurrent TestSprite load; tests capped at 15 high-priority cases
    location: frontend/
    impact: Coverage reduced vs. production build
  - issue: Frontend assumes the backend at NEXT_PUBLIC_API_URL is reachable; tests must have the local Flask backend on 5001 running
    location: frontend/app/dashboard/page.tsx and frontend/components/onboarding.tsx
    impact: Any flow that calls /api/search, /api/parse, /api/generate-cls/stream, or /api/sync-user will fail if the backend is down
  - issue: The /api/sync-user call in the NextAuth callback may still be tied to the google_id payload bug surfaced in backend Round 1
    location: frontend/app/api/auth/[...nextauth]/route.ts
    impact: Sign-in flow may appear to succeed client-side but silently fail to upsert the user in Postgres
