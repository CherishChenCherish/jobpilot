version: "2"
type: backend
tech_stack:
  - Python 3.11
  - Flask
  - SQLAlchemy
  - PostgreSQL (Railway)
  - Stripe SDK
  - Anthropic Claude API
  - Greenhouse / Lever public job APIs
  - Gunicorn (production WSGI)
  - Flask-CORS
features:
  - name: Health and Debug
    description: Liveness probe and database introspection endpoints.
    files:
      - backend/app.py
    endpoints:
      - method: GET
        path: /api/health
        description: Returns service status
        auth_required: false
        response_schema:
          "200": { status: string }
      - method: GET
        path: /api/debug/tables
        description: Returns database tables as {name: row_count} dict
        auth_required: false
        response_schema:
          "200": { tables: object, db_host: string, cached_jobs_exists: boolean, cached_jobs_count: integer }
    depends_on: []

  - name: User Authentication and Profile
    description: Syncs Google OAuth users into Postgres. Accepts email-only or google_id payloads.
    files:
      - backend/app.py
    endpoints:
      - method: POST
        path: /api/sync-user
        description: Upsert user from OAuth payload. Requires at least email or google_id.
        auth_required: false
        request_schema:
          body:
            email: string (required if no google_id)
            google_id: string (optional)
            name: string
            image: string
        response_schema:
          "200": User object with id, email, google_id, plan, searches_remaining
          "400": { error: string } when both email and google_id missing
      - method: GET
        path: /api/me
        description: Return user profile by google_id query param
        auth_required: true
        response_schema:
          "200": User
    depends_on: []

  - name: Resume Parsing
    description: Accepts PDF/DOCX resume, extracts structured fields via Claude.
    files:
      - backend/app.py
      - backend/parser.py
    endpoints:
      - method: POST
        path: /api/parse
        description: Parse uploaded resume
        auth_required: true
        request_schema:
          body:
            file: multipart/form-data (PDF or DOCX)
        response_schema:
          "200": { skills: string[], degree: string, direction: string }
          "400": Invalid file
    depends_on:
      - User Authentication and Profile

  - name: Job Search (Core Promise Gate)
    description: Cache-only search. Queries verified job cache, applies 4-condition Core Promise gate (open, location, direction, identity). Returns warming=true if cache is empty for the region.
    files:
      - backend/app.py
      - backend/searcher.py
      - backend/promise.py
    endpoints:
      - method: POST
        path: /api/search
        description: Search cached jobs filtered by direction, region, degree, visa
        auth_required: true
        request_schema:
          body:
            direction: string
            region: string
            degree: string
            visa_needed: boolean
        response_schema:
          "200": { jobs: Job[], audit_summary: object, warming: boolean }
    depends_on:
      - User Authentication and Profile

  - name: Cover Letter Generation
    description: Generates Claude-authored cover letter. Blocking endpoint capped to 1 job. SSE streaming variant for bulk.
    files:
      - backend/app.py
      - backend/generator.py
    endpoints:
      - method: POST
        path: /api/generate-cls
        description: Generate cover letter (blocking, 1 job max)
        auth_required: true
        response_schema:
          "200": { cover_letter: string }
      - method: GET
        path: /api/generate-cls/stream
        description: SSE stream of cover letter tokens
        auth_required: true
        response_schema:
          "200": text/event-stream
    depends_on:
      - Job Search (Core Promise Gate)

  - name: Demo Verification
    description: Public endpoint verifying a single job URL is live. Returns verified_open on all branches including errors.
    files:
      - backend/app.py
      - backend/verifier.py
    endpoints:
      - method: GET
        path: /api/demo-verify
        description: Verify a job URL is open
        auth_required: false
        request_schema:
          query:
            url: string
        response_schema:
          "200": { verified_open: boolean, status: string, confidence: string, reason: string }
          "500": { verified_open: false, error: string }
    depends_on: []

  - name: Stripe Payments
    description: Creates Stripe Checkout sessions and processes webhook events.
    files:
      - backend/app.py
    endpoints:
      - method: POST
        path: /api/stripe/create-checkout
        description: Create Stripe Checkout session
        auth_required: true
        response_schema:
          "200": { url: string }
      - method: POST
        path: /api/stripe/webhook
        description: Stripe webhook receiver
        auth_required: false
    depends_on:
      - User Authentication and Profile

known_limitations:
  - issue: Local dev DB has empty cached_jobs table — search returns warming=true with 0 jobs (valid behavior, not a bug)
    location: backend/app.py /api/search
    impact: Tests asserting job count > 0 will fail on local dev; production cache is populated by daily cron
